<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>

<h2>Contact Us</h2>

<form onsubmit="return validate()">

    Name:
    <input type="text" id="name"><br><br>

    Email:
    <input type="text" id="email"><br><br>

    Phone:
    <input type="text" id="phone"><br><br>

    Message:
    <textarea id="message"></textarea><br><br>

    <button type="submit">Send</button>

</form>

<p id="msg" style="color:red;"></p>

<script>

function validate() {

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let message = document.getElementById("message").value;
    let result = document.getElementById("msg");

    if (name == "" || email == "" || phone == "" || message == "") {
        result.innerHTML = "All fields are required";
        return false;
    }

    if (!email.includes("@")) {
        result.innerHTML = "Enter a valid email";
        return false;
    }

    if (phone.length != 10) {
        result.innerHTML = "Phone number must contain 10 digits";
        return false;
    }

    result.style.color = "green";
    result.innerHTML = "Message sent successfully!";
    return false;
}

</script>

</body>
</html>
